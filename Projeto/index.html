<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartões Interativos - Flexbox Items</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="./index.js" defer=""></script>
    <link rel="stylesheet" href="./index.css">
  </head>

  <body>
    <div class="container">
      <div class="card item1">
        <img src="https://ciclovivo.com.br/wp-content/uploads/2018/10/iStock-536613027.jpg" alt="Imagem 1">
        <h2>Card 1</h2>
        <p>Flex Grow 2</p>
        <button>Saiba Mais</button>
      </div>
      <div class="card item2">
        <img src="https://ciclovivo.com.br/wp-content/uploads/2018/10/iStock-536613027.jpg" alt="Imagem 2">
        <h2>Card 2</h2>
        <p>Flex Shrink 0</p>
        <button>Saiba Mais</button>
      </div>
      <div class="card item3">
        <img src="https://ciclovivo.com.br/wp-content/uploads/2018/10/iStock-536613027.jpg" alt="Imagem 3">
        <h2>Card 3</h2>
        <p>Flex Basis 300px</p>
        <button>Saiba Mais</button>
      </div>
      <div class="card item4">
        <img src="https://ciclovivo.com.br/wp-content/uploads/2018/10/iStock-536613027.jpg" alt="Imagem 4">
        <h2>Card 4</h2>
        <p>Align Self: Flex End</p>
        <button>Saiba Mais</button>
      </div>
      <div class="card item5">
        <img src="https://ciclovivo.com.br/wp-content/uploads/2018/10/iStock-536613027.jpg" alt="Imagem 5">
        <h2>Card 5</h2>
        <p>Default Flex Item</p>
        <button>Saiba Mais</button>
      </div>
    </div>


  </body>

</html>
